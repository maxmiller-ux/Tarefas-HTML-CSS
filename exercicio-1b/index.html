<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 - Método Interno</title>
    
    <!-- CSS Interno -->
    <style>
        p {
            color: yellow;
            font-weight: 900;
            font-style: italic;
            font-family: Arial, sans-serif;
            background-color: green;
        }
    </style>
</head>
<body>
    <p>Este parágrafo está formatado usando o método interno (CSS dentro da tag style no head).</p>
</body>
</html>
